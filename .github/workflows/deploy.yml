name: Deploy Security Worker

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to deploy the Security Worker
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SECURITY_D1_DATABASE_ID: ${{ vars.SECURITY_D1_DATABASE_ID }}
      SECURITY_D1_DATABASE_NAME: ${{ vars.SECURITY_D1_DATABASE_NAME }}
      DISCORD_BOT_TOKEN: ${{ secrets.SECURITY_DISCORD_BOT_TOKEN }}
      DISCORD_APPLICATION_ID: ${{ secrets.SECURITY_DISCORD_APPLICATION_ID }}
      MAIN_BOT_APPLICATION_ID: ${{ secrets.MAIN_BOT_APPLICATION_ID }}
      SECURITY_BRIDGE_SECRET: ${{ secrets.SECURITY_BRIDGE_SECRET }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use project npm version
        run: npm install --global npm@11.20.0

      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in             CLOUDFLARE_API_TOKEN             CLOUDFLARE_ACCOUNT_ID             SECURITY_D1_DATABASE_ID             DISCORD_BOT_TOKEN             DISCORD_APPLICATION_ID             MAIN_BOT_APPLICATION_ID             SECURITY_BRIDGE_SECRET
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required deployment setting: $name"
              missing=1
            fi
          done
          if [ "${#SECURITY_BRIDGE_SECRET}" -lt 32 ]; then
            echo "::error::SECURITY_BRIDGE_SECRET must be at least 32 characters"
            missing=1
          fi
          exit "$missing"

      - run: npm install

      - name: Dependency security audit
        run: npm audit --audit-level=moderate

      - run: npm run typecheck
      - run: npm test

      - name: Render production Wrangler config
        run: node scripts/render-deploy-config.mjs

      - name: Deploy Worker code
        run: npx wrangler deploy --config .wrangler.deploy.json

      - name: Apply Security Worker secrets
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const keys = [
            "DISCORD_BOT_TOKEN",
            "DISCORD_APPLICATION_ID",
            "MAIN_BOT_APPLICATION_ID",
            "SECURITY_BRIDGE_SECRET"
          ];
          const payload = Object.fromEntries(keys.map(key => [key, process.env[key]]));
          fs.writeFileSync("/tmp/discord-security-secrets.json", JSON.stringify(payload), {
            mode: 0o600
          });
          NODE
          npx wrangler secret bulk /tmp/discord-security-secrets.json --config .wrangler.deploy.json
          rm -f /tmp/discord-security-secrets.json

      - name: Verify required Worker secrets exist
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list --config .wrangler.deploy.json --format json > /tmp/secret-list.json
          node <<'NODE'
          const fs = require("node:fs");
          const rows = JSON.parse(fs.readFileSync("/tmp/secret-list.json", "utf8"));
          const names = new Set(rows.map(item => item.name));
          const required = [
            "DISCORD_BOT_TOKEN",
            "DISCORD_APPLICATION_ID",
            "MAIN_BOT_APPLICATION_ID",
            "SECURITY_BRIDGE_SECRET"
          ];
          const missing = required.filter(name => !names.has(name));
          if (missing.length) {
            console.error("Missing Worker secrets after deployment:", missing.join(", "));
            process.exit(1);
          }
          console.log("Required Security Worker secrets are configured.");
          NODE
          rm -f /tmp/secret-list.json
